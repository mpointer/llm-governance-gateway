name: Release

# Publish to npm with provenance on version tags (v0.1.0, v0.2.0, ...).
#
# Two ways to trigger a release:
#
#   1. Push a `v*` tag.
#   2. Run this workflow manually (Actions -> Release -> Run workflow) and
#      give it the version. It creates the tag for you, then publishes.
#      This exists because pushing a tag needs credentials that not every
#      release path has; a workflow run needs only the Actions permission.
#
# Both paths end in the same publish job, running off the tag, with the same
# guard: the tag must match package.json. A manual run cannot publish a
# version that the checked-out branch does not actually declare.
#
# The filename is load-bearing - npm's trusted-publishing config names this
# file, so renaming it silently breaks releases (see docs/publishing.md).
# The trust is bound to the file, not to the trigger, so `workflow_dispatch`
# mints a valid OIDC token exactly as a tag push does.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, no leading v (e.g. 0.13.0). Must match package.json on the branch you run from."
        required: true
        type: string

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # Manual runs only: a tag push already has its tag. Kept separate from the
  # publish job so that `contents: write` belongs to a job that installs no
  # dependencies and runs no third-party code.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
    steps:
      - uses: actions/checkout@v5
      - name: Verify the requested version matches package.json
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$INPUT_VERSION' is not a version. Give it as 0.13.0, with no leading v."
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
            echo "::error::Asked to release $INPUT_VERSION but $SOURCE_REF declares $PKG_VERSION. Bump package.json first, or run this from the branch that has the bump."
            exit 1
          fi
      - name: Create the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Re-running after a publish that failed downstream is fine, as
            # long as the tag still points where this run would put it.
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            EXISTING=$(git rev-list -n 1 "$TAG")
            if [ "$EXISTING" = "$(git rev-parse HEAD)" ]; then
              echo "$TAG already exists on this commit. Reusing it."
              exit 0
            fi
            echo "::error::$TAG already exists and points at $EXISTING, not $(git rev-parse HEAD). Delete the tag or bump to a new version."
            exit 1
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

  publish:
    needs: [tag]
    # The tag job is skipped on a tag push, which would otherwise skip this
    # one too.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || needs.tag.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION. Bump package.json first."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - name: Update npm (OIDC trusted publishing needs >= 11.5)
        run: npm install -g npm@latest
      - run: npm publish --provenance --access public
