name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint and format check (Biome)
        run: npm run check
      - run: npx tsc --noEmit
      - name: Typecheck examples
        run: npm run typecheck:examples
      - name: Tests with coverage summary
        run: npm run test:coverage
      - run: npm run build
      - name: Verify publishable contents
        run: npm pack --dry-run
